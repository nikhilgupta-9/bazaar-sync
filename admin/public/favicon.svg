<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-4" y="-4" width="72" height="72" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Base with Emerald Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner ambient light -->
  <rect x="3" y="3" width="58" height="28" rx="15" fill="#ffffff" fill-opacity="0.12" />

  <!-- Ascending Triple Market Candlestick Glyph -->
  <g filter="url(#shadow)">
    <!-- Bar 1 (Left - Initial Stage) -->
    <rect x="12" y="34" width="8.5" height="18" rx="2.5" fill="url(#barGrad)" fill-opacity="0.8" />
    <!-- Bar 2 (Middle - Growth Stage) -->
    <rect x="27.5" y="22" width="8.5" height="30" rx="2.5" fill="url(#barGrad)" fill-opacity="0.92" />
    <!-- Bar 3 (Right - Peak Stage) -->
    <rect x="43" y="12" width="8.5" height="40" rx="2.5" fill="url(#barGrad)" fill-opacity="1" />
  </g>
</svg>
