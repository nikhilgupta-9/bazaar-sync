<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <!-- Lato/Nunito Sans: landing page headline/body fonts, see
         components/landing/theme.css — scoped to the landing page only,
         the rest of the app keeps its existing Inter stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("bazaar_sync_theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage unavailable — falls back to light, same as no preference saved yet */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
