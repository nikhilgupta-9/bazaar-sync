<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazaar Sync — Options Analytics &amp; Backtesting</title>
    <!-- Lato/Nunito Sans: landing page headline/body fonts, see
         components/landing/theme.css — scoped to the landing page only,
         the rest of the app keeps its existing Inter stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bazaar_sync_theme");
          // "ocean" is a teal-tinted variant of dark mode — it carries the
          // same `dark` class so every existing dark: Tailwind utility still
          // applies, plus `data-theme="ocean"` so the --bs-* token overrides
          // in index.css can retint the token-based surfaces on top of that.
          if (saved === "dark" || saved === "ocean") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          if (saved === "ocean") {
            document.documentElement.setAttribute("data-theme", "ocean");
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
        } catch (e) {
          document.documentElement.classList.remove("dark");
          document.documentElement.removeAttribute("data-theme");
        }
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
